<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CITRA — AI Search Intelligence</title>
<style>
:root{--bg:#050507;--panel:#0c0c10;--line:#262631;--text:#f4f4f7;--muted:#9293a5;--purple:#8b4dff;--cyan:#19d8df;--lime:#9bea35;--red:#ff3d58;--orange:#ffb01f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1b1038 0,#08070d 32%,var(--bg) 65%);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input{font:inherit}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:#07070adf;backdrop-filter:blur(12px);z-index:5}.brand{font-weight:800;letter-spacing:.04em}.brand i{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,var(--cyan) 0 25%,#4d25ff 28% 100%);vertical-align:-4px;margin-right:8px}.nav{display:flex;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#19141f;color:#fff}.wrap{max-width:1180px;margin:auto;padding:42px 24px 80px}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:.2em;color:#7e94aa;text-transform:uppercase}.hero{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:28px}.hero h1{font-size:34px;margin:8px 0}.hero p{color:var(--muted);max-width:680px}.btn{border:1px solid #7040c7;background:#21113b;color:#fff;border-radius:9px;padding:10px 15px;cursor:pointer}.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(5,1fr)}.cards{grid-template-columns:repeat(3,1fr)}.card{background:linear-gradient(180deg,#101014,#0b0b0e);border:1px solid var(--line);border-radius:14px;padding:18px}.big{font-size:34px;font-weight:700;margin:10px 0}.small{color:var(--muted);font-size:12px;line-height:1.5}.bar{height:6px;background:#1b1b22;border-radius:8px;overflow:hidden;margin-top:12px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:8px}.score{width:210px;height:210px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--cyan) 0 62%,#24242d 62%);padding:12px}.score:after{content:"";width:100%;height:100%;border-radius:50%;background:#0b0b0f;display:block;grid-area:1/1}.score span{grid-area:1/1;z-index:1;text-align:center;font-size:46px;font-weight:800}.score small{display:block;font:10px ui-monospace,monospace;color:var(--muted);letter-spacing:.2em}.overview{grid-template-columns:280px 1fr}.engine{display:flex;align-items:center;gap:15px;margin:17px 0}.engine label{width:90px;color:#b4b4c3}.engine .bar{flex:1;margin:0}.section{margin-top:28px}.section h2{font-size:18px;margin:0 0 14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left}.table th{color:#777889;font:10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.14em}.pill{display:inline-block;border:1px solid #3b3b47;border-radius:999px;padding:3px 8px;font:10px ui-monospace,monospace;color:#aaa}.green{color:var(--lime)}.red{color:var(--red)}.yellow{color:var(--orange)}.hidden{display:none}.analysis{max-width:620px;margin:80px auto;text-align:center}.analysis h1{font-size:40px}.stage{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:15px;border-radius:10px;margin:8px 0;text-align:left}.stage.run{border-color:#7441e8;box-shadow:0 0 30px #5920a022}.dot{width:20px;height:20px;border-radius:50%;border:1px solid #555;display:inline-grid;place-items:center;margin-right:12px}.shot{max-width:100%;border:1px solid var(--line);border-radius:12px}.footer{border-top:1px solid var(--line);margin-top:50px;padding-top:20px;color:#656677;text-align:center;font:10px ui-monospace,monospace;letter-spacing:.14em}@media(max-width:900px){.metrics,.cards{grid-template-columns:1fr 1fr}.overview{grid-template-columns:1fr}.nav{overflow:auto}.top{padding:0 12px}.wrap{padding:28px 14px}.hero{display:block}}@media(max-width:560px){.metrics,.cards{grid-template-columns:1fr}.nav button{padding:8px 7px;font-size:12px}.hero h1{font-size:28px}}
</style></head>
<body>
<header class="top"><div class="brand"><i></i>CITRA</div><nav class="nav" id="nav"></nav><button class="btn" onclick="show('analysis')">Analyze site ↗</button></header>
<main class="wrap" id="app"></main>
<script>
const engines=[['ChatGPT',71],['Gemini',48],['Perplexity',66],['Google AI',55],['Copilot',43]];
const queries=[['best revenue analytics platform for B2B SaaS',42,'Clearpoint'],['alternatives to spreadsheet revenue reporting',81,'Ledgerly'],['how to forecast ARR accurately',94,'Clearpoint'],['top pipeline intelligence tools 2026',35,'Axion'],['revenue analytics for RevOps teams',63,'Clearpoint'],['northwind vs clearpoint',88,'Clearpoint'],['cheapest ARR dashboard for startups',57,'Ledgerly'],['best tools to track net revenue retention',29,'Axion']];
const competitors=[['Northwind',62,58,41,54,47],['Clearpoint',84,79,72,88,91],['Ledgerly',71,68,63,66,74],['Axion',57,51,49,61,58]];
const entities=[['Organization',88,'healthy'],['Product',54,'partial'],['Service',46,'partial'],['Author',12,'missing'],['Location',81,'healthy'],['FAQ',8,'missing'],['Reviews',61,'partial']];
const citations=[['g2.com',92,48,'Review marketplace'],['northwind.io/docs',71,34,'Owned documentation'],['clearpoint.com/compare',78,31,'Competitor owned'],['reddit.com/r/revops',64,27,'Community'],['saastr.com',83,22,'Industry publication'],['northwind.io/benchmarks',69,19,'Owned research'],['capterra.com',74,16,'Review marketplace'],['news.ycombinator.com',58,11,'Community']];
const actions=[['Publish a first-party comparison hub','Ship structured, honest comparison pages for tracked competitors.','CRITICAL','+11 to +16 visibility points'],['Add FAQ and Author entities sitewide','Add explicit FAQ and author entity coverage.','CRITICAL','Across every engine'],['Own the ARR forecasting topic','Build the missing topic cluster around ARR forecasting.','HIGH','High opportunity'],['Make pricing machine-readable','Expose pricing and cost data as structured content.','HIGH','Better cost comparisons'],['Activate RevOps community proof','Build community evidence and independent mentions.','MEDIUM','More source diversity']];
function nav(){document.getElementById('nav').innerHTML=['overview','queries','competitors','citations','entity','actions'].map(x=>`<button onclick="show('${x}')" id="n-${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}
function pageHead(label,title,desc){return `<div class="hero"><div><div class="eyebrow">${label}</div><h1>${title}</h1><p>${desc}</p></div></div>`}
function show(tab){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));let b=document.getElementById('n-'+tab);if(b)b.classList.add('active');let a=document.getElementById('app');if(tab==='analysis')return analysis();if(tab==='overview')return overview(a);if(tab==='queries')return queriesPage(a);if(tab==='competitors')return competitorsPage(a);if(tab==='citations')return citationsPage(a);if(tab==='entity')return entityPage(a);if(tab==='actions')return actionsPage(a)}
function overview(a){a.innerHTML=pageHead('Overview','Your site AI visibility','Modelled from 8 buyer queries simulated across 5 answer engines.');a.innerHTML+=`<section class="grid overview"><div class="card" style="display:grid;place-items:center"><div class="score"><span>62<small>AI VISIBILITY</small></span></div><p class="green">+7.4 vs last run</p><p class="small">Above category median (54), behind category leader (84).</p></div><div class="card"><div class="eyebrow">AI ecosystem</div><h2>Engine-level presence</h2>${engines.map(e=>`<div class="engine"><label>${e[0]}</label><div class="bar"><i style="width:${e[1]}%"></i></div><b>${e[1]}</b></div>`).join('')}</div></section><section class="section"><div class="grid metrics">${[['Mention rate','58%','+6.4'],['Recommendation rate','34%','-2.1'],['Citation rate','41%','+9.2'],['Competitor share','66%','-3.5'],['Source diversity','27','+4']].map(m=>`<div class="card"><div class="eyebrow">${m[0]}</div><div class="big">${m[1]}</div><div class="small ${m[2][0]=='-'?'red':'green'}">${m[2]}</div></div>`).join('')}</div></section><section class="section grid cards"><div class="card"><div class="eyebrow">Biggest opportunity</div><h2>how to forecast ARR accurately</h2><p class="small">Opportunity score 94. No brand presence, very high volume.</p></div><div class="card"><div class="eyebrow">Fastest fix</div><h2>Add FAQ and Author entities</h2><p class="small">Improve citation and entity confidence across answer engines.</p></div></section><div class="footer">CITRA · AI SEARCH INTELLIGENCE · DEMO DATA</div>`}
function queriesPage(a){a.innerHTML=pageHead('Queries','Query intelligence','Each row is a buyer question simulated against every answer engine.');a.innerHTML+=`<div class="card"><table class="table"><thead><tr><th>Query</th><th>Mention</th><th>Rec.</th><th>Citation</th><th>Opp.</th><th>Competitor</th></tr></thead><tbody>${queries.map(q=>`<tr><td>${q[0]}</td><td class="green">✓</td><td class="green">✓</td><td class="green">✓</td><td>${q[1]}</td><td>${q[2]}</td></tr>`).join('')}</tbody></table></div>`}
function competitorsPage(a){a.innerHTML=pageHead('Competitors','Competitor intelligence','Brands extracted from simulated answers and compared across five visibility signals.');a.innerHTML+=`<div class="card"><h2>Northwind vs Clearpoint</h2>${[['Brand visibility',62,84],['Mention frequency',58,79],['Citation strength',41,72],['Topical authority',54,88],['Entity completeness',47,91]].map(x=>`<div class="engine"><label>${x[0]}</label><div style="flex:1"><div class="small">Northwind ${x[1]}</div><div class="bar"><i style="width:${x[1]}%"></i></div><div class="small">Clearpoint ${x[2]}</div><div class="bar"><i style="width:${x[2]}%;background:var(--cyan)"></i></div></div></div>`).join('')}</div><section class="section card"><table class="table"><thead><tr><th>Brand</th><th>Visibility</th><th>Mentions</th><th>Citation</th><th>Topical</th><th>Entity</th></tr></thead><tbody>${competitors.map(c=>`<tr>${c.map((v,i)=>`<td>${i?v:''}${i? '':v}</td>`).join('')}</tr>`).join('')}</tbody></table></section>`}
function citationsPage(a){a.innerHTML=pageHead('Citations','Citation explorer','See which sources feed simulated AI answers and where your owned sources can improve coverage.');a.innerHTML+=`<div class="grid cards">${citations.map(c=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${c[0]}</b><span class="pill">${c[3]}</span></div><div class="small" style="margin-top:16px">Authority <b>${c[1]}</b></div><div class="bar"><i style="width:${c[1]}%"></i></div><div class="small" style="margin-top:12px">Citation frequency <b>${c[2]} answers</b></div><div class="bar"><i style="width:${Math.min(100,c[2]*2)}%;background:var(--cyan)"></i></div></div>`).join('')}</div>`}
function entityPage(a){a.innerHTML=pageHead('Entity','Entity health','Answer engines can only recommend what they can resolve. These entities describe your business.');a.innerHTML+=`<div class="grid cards">${entities.map(e=>`<div class="card"><div style="display:flex;justify-content:space-between"><h2>${e[0]}</h2><span class="pill ${e[2]=='healthy'?'green':e[2]=='missing'?'red':'yellow'}">${e[2]}</span></div><div class="big">${e[1]}%</div><div class="bar"><i style="width:${e[1]};background:${e[2]=='healthy'?'var(--lime)':e[2]=='missing'?'var(--purple)':'var(--orange)'}"></i></div><p class="small">${e[2]=='healthy'?'Entity signals resolve consistently across sources.':e[2]=='missing'?'Coverage is missing and needs explicit structured data.':'Coverage is partial and can be strengthened.'}</p></div>`).join('')}</div>`}
function actionsPage(a){a.innerHTML=pageHead('Actions','AI action plan','Prioritized actions based on simulated visibility gaps and expected effort.');a.innerHTML+=`<div class="grid">${actions.map((x,i)=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:20px"><div><div class="eyebrow">0${i+1}</div><h2>${x[0]}</h2><p class="small">${x[1]}</p></div><span class="pill ${x[2]=='CRITICAL'?'red':x[2]=='HIGH'?'yellow':''}">${x[2]}</span></div><p class="green">${x[3]}</p></div>`).join('')}</div>`}
function analysis(){document.getElementById('app').innerHTML=`<div class="analysis"><div class="eyebrow">Analyzing your site</div><h1>Simulating how AI answers your category</h1><div class="bar" style="height:5px"><i id="prog" style="width:0%"></i></div><div style="margin-top:28px">${['Crawling','Entity discovery','Topical analysis','Query simulation','Competitor analysis','Visibility model'].map((x,i)=>`<div class="stage" id="s${i}"><div><span class="dot">${i<1?'✓':''}</span><b>${x}</b><div class="small">${['Fetching site structure and rendered content','Resolving organization, product and author entities','Mapping topical authority against the category graph','Running buyer queries across 5 answer engines','Extracting competing brands from every answer','Scoring mentions, recommendations and citations'][i]}</div></div><span class="eyebrow" id="st${i}">QUEUED</span></div>`).join('')}</div></div>`;let i=0,t=setInterval(()=>{document.getElementById('prog').style.width=((i+1)/6*100)+'%';if(i>0){document.getElementById('s'+(i-1)).classList.remove('run');document.getElementById('st'+(i-1)).textContent='DONE'}let s=document.getElementById('s'+i);if(s)s.classList.add('run');let st=document.getElementById('st'+i);if(st)st.textContent='RUNNING';i++;if(i>6){clearInterval(t);setTimeout(()=>show('overview'),500)}},500)}
nav();show('overview');
</script></body></html>
